# Netlify configuration for R Dental Centre
# Next.js static export (next.config.ts: output: "export") emits a fully
# pre-rendered site into out/, which Netlify serves as static files.

[build]
  command = "next build"
  publish = "out"

[build.environment]
  # Next.js 15 requires a modern Node runtime.
  NODE_VERSION = "20"

# Long-cache the immutable hashed assets Next emits under /_next/static.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
